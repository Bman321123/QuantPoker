# Render Blueprint — deploys Quant Poker Trainer as a Node WEB SERVICE.
# A small Express server (server/index.js) serves the built front-end and hosts the
# API you'll grow into for user login and the shared leaderboard.
#
# To use: in Render, New > Blueprint and point it at this repo. Or configure a Web
# Service manually with the same Build/Start commands below.
services:
  - type: web
    name: quantpoker
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # When you add a database later, create one in Render and Render can inject its
      # connection string here automatically:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: quantpoker-db
      #     property: connectionString
